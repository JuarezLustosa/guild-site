<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1729"/>
      <stop offset="1" stop-color="#03070d"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#b47cff" stop-opacity=".95"/>
      <stop offset=".16" stop-color="#7a3fd0" stop-opacity=".88"/>
      <stop offset=".42" stop-color="#3c206f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#150f2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b111a"/>
      <stop offset=".48" stop-color="#232c3c"/>
      <stop offset="1" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23334e"/>
      <stop offset=".5" stop-color="#0b111b"/>
      <stop offset="1" stop-color="#02050a"/>
    </linearGradient>
    <linearGradient id="blueArmor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#365a8e"/>
      <stop offset=".42" stop-color="#11233d"/>
      <stop offset="1" stop-color="#04080d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1800" height="760" fill="url(#sky)"/>
  <ellipse cx="1180" cy="245" rx="450" ry="300" fill="url(#violet)" opacity=".9"/>
  <circle cx="1210" cy="96" r="190" fill="#25224f" opacity=".14" filter="url(#soft)"/>

  <!-- distant mountains -->
  <path d="M0 420 190 260 325 390 470 210 610 385 795 250 960 420v340H0Z" fill="#07101b" opacity=".78"/>
  <path d="M850 410 990 290 1115 390 1270 220 1440 385 1610 255 1800 430v330H850Z" fill="#080e1a" opacity=".88"/>

  <!-- citadel silhouette -->
  <g transform="translate(880 80)">
    <path d="M120 555 165 258 215 210 243 98 271 210 321 258 365 555Z" fill="url(#stone)" stroke="#33405a" stroke-opacity=".45"/>
    <path d="M210 555 260 335 305 278 345 0 388 278 435 335 485 555Z" fill="url(#stone)" stroke="#3b4760" stroke-opacity=".52"/>
    <path d="M405 555 443 285 482 242 514 116 546 242 588 285 626 555Z" fill="url(#stone)" stroke="#33405a" stroke-opacity=".45"/>
    <path d="M-10 555 24 335 61 285 90 150 121 285 158 335 192 555Z" fill="#0a1019"/>
    <path d="M600 555 632 330 670 280 704 138 736 280 776 330 808 555Z" fill="#091019"/>
    <!-- spikes -->
    <path d="M36 338 15 294 54 312 69 260 85 315 118 292 105 342ZM666 333l-22-48 40 19 18-57 14 59 37-26-13 57Z" fill="#101828"/>
    <!-- windows -->
    <g fill="#8349d8" opacity=".75" filter="url(#glow)">
      <rect x="326" y="198" width="10" height="32" rx="5"/>
      <rect x="368" y="198" width="10" height="32" rx="5"/>
      <rect x="287" y="315" width="9" height="28" rx="4"/>
      <rect x="410" y="315" width="9" height="28" rx="4"/>
      <rect x="232" y="284" width="8" height="26" rx="4"/>
      <rect x="492" y="276" width="8" height="26" rx="4"/>
    </g>
    <!-- portal -->
    <ellipse cx="347" cy="430" rx="86" ry="118" fill="#4c237e" opacity=".75" filter="url(#glow)"/>
    <ellipse cx="347" cy="430" rx="55" ry="92" fill="url(#violet)" stroke="#b789ff" stroke-width="3"/>
    <path d="M300 514V425q0-67 47-67t47 67v89" fill="none" stroke="#d0adff" stroke-opacity=".5" stroke-width="4"/>
  </g>

  <!-- stairs/ground -->
  <path d="M760 760 1058 466h355l252 294Z" fill="#0a1018" opacity=".96"/>
  <g stroke="#384055" stroke-opacity=".25">
    <path d="M900 700h640M930 660h580M960 620h520M995 580h450M1030 540h385M1070 505h315"/>
  </g>

  <!-- adventurer left -->
  <g transform="translate(760 380)">
    <path d="M80 70 38 120l12 140-42 110h150l-25-115 9-135Z" fill="url(#armor)"/>
    <path d="M60 72 80 25l24 47-10 44H68Z" fill="#0c121b"/>
    <path d="m43 117-44 48 24 25 55-49Zm100 0 54 54-26 22-53-52Z" fill="#101a28"/>
    <path d="M55 108 12 122 42 72 75 89Zm63-2 42 9-29-47-35 22Z" fill="#263a59"/>
    <path d="M7 97 26 77 52 151 37 157Z" fill="#2a4f82" opacity=".75"/>
    <circle cx="79" cy="62" r="3" fill="#6ea3ff" filter="url(#glow)"/>
  </g>

  <!-- center adventurer -->
  <g transform="translate(1190 493) scale(.78)">
    <path d="M48 46 19 91l15 115-23 76h105l-16-78 11-113-31-45Z" fill="url(#armor)"/>
    <path d="M44 46 62 14l20 33-8 35H51Z" fill="#111827"/>
    <path d="m23 95-33 37 18 21 41-34Zm85 0 38 43-20 16-37-37Z" fill="#152032"/>
    <circle cx="64" cy="52" r="3" fill="#8c5bff" filter="url(#glow)"/>
  </g>

  <!-- right champion -->
  <g transform="translate(1450 370)">
    <path d="M78 75 33 130l17 145-37 118h157l-30-123 10-141-45-54Z" fill="url(#blueArmor)"/>
    <path d="M64 75 90 22l27 54-11 48H75Z" fill="#0c1320"/>
    <path d="m38 126-51 55 30 26 60-48Zm110-2 59 62-29 25-57-52Z" fill="#14243c"/>
    <path d="M48 121 4 130 35 75 74 98Zm78 0 48 7-36-57-39 28Z" fill="#315b91"/>
    <path d="M201 163 230 78" stroke="#98bfff" stroke-width="5" filter="url(#glow)"/>
    <circle cx="95" cy="65" r="4" fill="#75a8ff" filter="url(#glow)"/>
  </g>

  <!-- mage glow -->
  <g transform="translate(1320 500)">
    <path d="M40 33 11 75l10 93-24 66h90l-17-68 8-91-25-42Z" fill="#101525"/>
    <circle cx="95" cy="120" r="28" fill="#8f65ff" opacity=".45" filter="url(#glow)"/>
    <circle cx="95" cy="120" r="7" fill="#e1d4ff"/>
  </g>

  <!-- atmospheric haze -->
  <rect y="565" width="1800" height="195" fill="url(#violet)" opacity=".12"/>
  <rect width="1800" height="760" fill="none" stroke="#111f31" stroke-width="2"/>
</svg>
